<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" role="img" aria-labelledby="title desc">
  <title id="title">The Confidence Reset — 7 Principles for a Stronger Mind</title>
  <desc id="desc">Black and gold book cover for The Confident Mind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.58" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#b47b32"/>
      <stop offset="0.5" stop-color="#f0cc83"/>
      <stop offset="1" stop-color="#a96d29"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9b15d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d9b15d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211e1a"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1000" height="1500" fill="url(#bg)"/>
  <rect x="18" y="18" width="964" height="1464" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <g fill="url(#gold)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <rect x="430" y="70" width="140" height="140" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <text x="500" y="155" font-size="54">TCM</text>
    <text x="500" y="250" fill="#f4f1ea" font-size="24" letter-spacing="10">THE CONFIDENT MIND</text>
    <line x1="342" y1="286" x2="460" y2="286" stroke="#c89b50" stroke-width="2"/>
    <line x1="540" y1="286" x2="658" y2="286" stroke="#c89b50" stroke-width="2"/>
    <circle cx="500" cy="286" r="6"/>
    <text x="500" y="380" fill="#e7e1d8" font-size="42" letter-spacing="8">THE</text>
    <text x="500" y="490" fill="#eee8df" font-size="86" letter-spacing="4">CONFIDENCE</text>
    <text x="500" y="600" font-size="105" letter-spacing="6">RESET</text>
    <text x="500" y="675" fill="#f0ede7" font-size="26" letter-spacing="8">7 PRINCIPLES FOR A STRONGER MIND</text>
  </g>

  <g transform="translate(500 795)">
    <circle r="92" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M-20 20v-54m0 14c-30-22-50-5-50 13 0 18 22 33 50 33m0-26c30-22 50-5 50 13 0 18-22 33-50 33m0-54c-12-22-4-48 15-60m-15 60c12-22 4-48-15-60" fill="none" stroke="#d9b15d" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="86" fill="#eed79d" font-size="22" text-anchor="middle" font-family="Georgia, serif" letter-spacing="5">FREE</text>
    <text x="0" y="114" fill="#eee8df" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="5">GUIDE</text>
  </g>

  <circle cx="500" cy="1110" r="230" fill="url(#sun)"/>
  <path d="M0 1080 Q120 1000 250 1060 T500 1040 T750 1055 T1000 1020 V1225 H0Z" fill="#090a0c"/>
  <path d="M0 1110 Q130 1015 250 1085 T500 1060 T760 1075 T1000 1040 V1225 H0Z" fill="#111216" opacity=".9"/>
  <rect x="0" y="1200" width="1000" height="180" fill="url(#lake)"/>
  <path d="M0 1235 Q160 1215 320 1240 T650 1235 T1000 1248" stroke="#8d6a39" stroke-opacity=".45" fill="none" stroke-width="3"/>
  <path d="M0 1270 Q180 1250 350 1275 T700 1270 T1000 1280" stroke="#8d6a39" stroke-opacity=".25" fill="none" stroke-width="2"/>

