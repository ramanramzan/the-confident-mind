    <ellipse cx="0" cy="140" rx="125" ry="48" fill="#17181a" stroke="#3f3b36"/>
    <ellipse cx="0" cy="80" rx="95" ry="38" fill="#212225" stroke="#4a443a"/>
    <ellipse cx="0" cy="30" rx="68" ry="31" fill="#2a2a2b" stroke="#504735"/>
    <ellipse cx="0" cy="-18" rx="45" ry="24" fill="#333333"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#f1eadf" text-anchor="middle">
    <g transform="translate(135 1380)"><circle cx="0" cy="0" r="27" fill="none" stroke="#d4a85c" stroke-width="2"/><text y="58">MASTER</text><text y="82">YOUR MIND</text></g>
    <line x1="255" y1="1340" x2="255" y2="1445" stroke="#d4a85c" stroke-opacity=".6"/>
    <g transform="translate(330 1380)"><path d="M0-24 23-12v25c0 20-23 31-23 31S-23 33-23 13v-25Z" fill="none" stroke="#d4a85c" stroke-width="2"/><text y="58">BUILD INNER</text><text y="82">STRENGTH</text></g>
    <line x1="445" y1="1340" x2="445" y2="1445" stroke="#d4a85c" stroke-opacity=".6"/>
    <g transform="translate(500 1380)"><circle cx="0" cy="-8" r="18" fill="none" stroke="#d4a85c" stroke-width="2"/><path d="M-34 28c8-22 60-22 68 0" fill="none" stroke="#d4a85c" stroke-width="2"/><text y="58">STOP SEEKING</text><text y="82">APPROVAL</text></g>
    <line x1="555" y1="1340" x2="555" y2="1445" stroke="#d4a85c" stroke-opacity=".6"/>
    <g transform="translate(670 1380)"><path d="M0-24c-12 10-18 20-14 32 4 12 28 12 28 0 4-12-2-22-14-32Z" fill="none" stroke="#d4a85c" stroke-width="2"/><text y="58">SET BETTER</text><text y="82">BOUNDARIES</text></g>
    <line x1="785" y1="1340" x2="785" y2="1445" stroke="#d4a85c" stroke-opacity=".6"/>
    <g transform="translate(865 1380)"><path d="M-32 14 0-20 16-4 42-34" fill="none" stroke="#d4a85c" stroke-width="3"/><text y="58">BECOME HARDER</text><text y="82">TO SHAKE</text></g>
  </g>

  <rect x="18" y="1450" width="964" height="32" fill="#d5aa5e" opacity=".88"/>
  <text x="500" y="1474" fill="#14110d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="8">MIND • STRATEGY • DISCIPLINE • POWER</text>
</svg>
